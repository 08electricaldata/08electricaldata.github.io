<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Scanner View</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #0e1621;
  color: white;
  text-align: center;
  padding: 20px;
}

.top-nav {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  justify-content: center;
}

.top-nav button {
  padding: 6px 14px;
  background: #003f88;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

.top-nav button:hover {
  background: #0050aa;
}

.container {
  max-width: 420px;
  margin: auto;
}

h2 {
  margin: 10px 0 5px;
  font-size: 22px;
  color: #93c5fd;
}

.subtitle {
  font-size: 13px;
  margin-bottom: 18px;
  opacity: 0.85;
}

#reader {
  width: 100%;
  margin: auto;
}

.status {
  margin-top: 15px;
  font-size: 14px;
  color: #22c55e;
  overflow-wrap: anywhere;
}

.result-box {
  margin-top: 15px;
  background: #1e293b;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

@media (max-width: 480px) {
  h2 { font-size: 20px; }
  .subtitle { font-size: 12px; }
}
</style>
</head>

<body>

<div class="top-nav">
  <button type="button" onclick="history.back()">⬅ Back</button>
  <button type="button" onclick="location.href='https://08electricaldata.github.io/'">🏠 Home</button>
</div>

<div class="container">
  <h2>📷 Scan QR Code</h2>
  <div class="subtitle">
    Point the camera at equipment QR<br>
    Designed and Maintained by Rakesh Chandra Sethy
  </div>

  <div id="reader"></div>
  <div class="status" id="status" role="status" aria-live="polite">
    Starting camera…
  </div>
  <div class="result-box" id="result"></div>
</div>

<script>
const statusElement = document.getElementById("status");
const resultElement = document.getElementById("result");

let scanner;
let hasScanned = false;

function playBeep() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;

    const audioContext = new AudioContext();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(900, audioContext.currentTime);
    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);

    oscillator.start();
    setTimeout(() => {
      oscillator.stop();
      audioContext.close();
    }, 120);
  } catch (error) {
    console.warn("Could not play scan beep:", error);
  }
}

function onScanSuccess(decodedText) {
  if (hasScanned) return;
  hasScanned = true;

  playBeep();

  let scannedUrl;
  try {
    scannedUrl = new URL(decodedText);
  } catch {
    statusElement.textContent = "QR code scanned, but it does not contain a valid link.";
    resultElement.textContent = decodedText;
    return;
  }

  if (scannedUrl.protocol !== "https:" && scannedUrl.protocol !== "http:") {
    statusElement.textContent = "QR code scanned, but its link type is not supported.";
    resultElement.textContent = decodedText;
    return;
  }

  statusElement.textContent = "✅ QR scanned. Opening link…";
  window.location.href = scannedUrl.href;
}

async function startScanner() {
  if (!window.isSecureContext) {
    statusElement.textContent = "Camera access requires this page to be opened using HTTPS.";
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    statusElement.textContent = "Camera access is not available in this browser.";
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    statusElement.textContent = "The QR scanner failed to load. Check your internet connection and reload.";
    return;
  }

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1
      },
      onScanSuccess,
      () => {}
    );

    statusElement.textContent = "Camera is on. Point it at a QR code.";
  } catch (error) {
    console.error("Could not start camera:", error);

    if (error?.name === "NotAllowedError" ||
        error?.name === "PermissionDeniedError") {
      statusElement.textContent =
        "Camera permission was denied. Allow camera access for this site in your browser settings, then reload.";
    } else {
      statusElement.textContent =
        "Could not open the camera. Check this site's camera permission and try again.";
    }
  }
}

startScanner();
</script>

</body>
</html>
