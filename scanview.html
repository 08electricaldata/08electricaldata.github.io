<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Scanner View</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #0e1621;
  color: white;
  text-align: center;
  padding: 20px;
}

.top-nav {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  justify-content: center;
}

button {
  padding: 10px 14px;
  background: #003f88;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #0050aa;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.container {
  max-width: 420px;
  margin: auto;
}

h2 {
  margin: 10px 0 5px;
  font-size: 22px;
  color: #93c5fd;
}

.subtitle {
  font-size: 13px;
  margin-bottom: 18px;
  opacity: 0.85;
}

#reader {
  width: 100%;
  margin: auto;
}

.camera-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 15px 0;
}

.status {
  margin-top: 15px;
  font-size: 14px;
  color: #22c55e;
  overflow-wrap: anywhere;
}

.result-box {
  margin-top: 15px;
  background: #1e293b;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.result-box a {
  display: inline-block;
  margin-top: 12px;
  color: #93c5fd;
}

@media (max-width: 480px) {
  h2 { font-size: 20px; }
  .subtitle { font-size: 12px; }
}
</style>
</head>

<body>

<div class="top-nav">
  <button type="button" onclick="history.back()">⬅ Back</button>
  <button type="button" onclick="location.href='https://08electricaldata.github.io/'">🏠 Home</button>
</div>

<div class="container">
  <h2>📷 Scan QR Code</h2>
  <div class="subtitle">
    Point the camera at equipment QR<br>
    Designed and Maintained by Rakesh Chandra Sethy
  </div>

  <div class="camera-controls">
    <button id="startButton" type="button">Start camera</button>
    <button id="stopButton" type="button" disabled>Stop camera</button>
  </div>

  <div id="reader"></div>
  <div class="status" id="status" role="status" aria-live="polite">
    Tap “Start camera” and allow camera access when prompted.
  </div>
  <div class="result-box" id="result" aria-live="polite"></div>
</div>

<script>
const statusElement = document.getElementById("status");
const resultElement = document.getElementById("result");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");

const scannerConfig = {
  fps: 10,
  qrbox: { width: 250, height: 250 },
  aspectRatio: 1
};

let scanner = null;
let isScanning = false;
let hasScanned = false;

function playBeep() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;

    const audioContext = new AudioContext();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(900, audioContext.currentTime);
    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);

    oscillator.start();
    setTimeout(() => {
      oscillator.stop();
      audioContext.close();
    }, 120);
  } catch (error) {
    console.warn("Could not play scan beep:", error);
  }
}

function vibratePhone() {
  if (navigator.vibrate) {
    navigator.vibrate(150);
  }
}

async function startCamera() {
  resultElement.replaceChildren();
  hasScanned = false;

  if (!window.isSecureContext) {
    statusElement.textContent =
      "Camera access requires a secure connection (HTTPS). Open this page using its https:// address.";
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    statusElement.textContent =
      "Camera access is not available in this browser. Try opening this page in Chrome or Safari.";
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    statusElement.textContent =
      "The QR scanner could not load. Check your internet connection and reload the page.";
    return;
  }

  startButton.disabled = true;
  statusElement.textContent = "Requesting camera access…";

  try {
    scanner = new Html5Qrcode("reader");

    // Prefer the rear camera on phones. This call is made from the button
    // click so the browser can show its camera-permission prompt.
    await scanner.start(
      { facingMode: "environment" },
      scannerConfig,
      onScanSuccess,
      () => {}
    );

    isScanning = true;
    stopButton.disabled = false;
    statusElement.textContent = "Camera is on. Point it at a QR code.";
  } catch (error) {
    console.error("Could not start camera:", error);

    const errorName = error?.name || "";
    if (errorName === "NotAllowedError" || errorName === "PermissionDeniedError") {
      statusElement.textContent =
        "Camera permission was denied. Allow camera access for this site in your browser settings, then try again.";
    } else if (errorName === "NotFoundError" || errorName === "DevicesNotFoundError") {
      statusElement.textContent = "No camera was found on this device.";
    } else {
      statusElement.textContent =
        "Could not open the camera. Check the browser’s site permissions and make sure no other app is using the camera.";
    }

    scanner = null;
    startButton.disabled = false;
    stopButton.disabled = true;
  }
}

async function stopCamera() {
  if (!scanner || !isScanning) return;

  try {
    await scanner.stop();
  } catch (error) {
    console.warn("Could not stop scanner cleanly:", error);
  }

  scanner.clear();
  scanner = null;
  isScanning = false;
  startButton.disabled = false;
  stopButton.disabled = true;
  statusElement.textContent = "Camera stopped.";
}

async function onScanSuccess(decodedText) {
  if (hasScanned) return;
  hasScanned = true;

  playBeep();
  vibratePhone();

  statusElement.textContent = "✅ QR code scanned successfully.";
  resultElement.replaceChildren();

  const text = document.createElement("div");
  text.textContent = decodedText;
  resultElement.appendChild(text);

  // Show a link only for HTTP(S) URLs, and require the user to click it.
  // This avoids automatically redirecting to an unexpected QR-code destination.
  try {
    const url = new URL(decodedText);
    if (url.protocol === "https:" || url.protocol === "http:") {
      const link = document.createElement("a");
      link.href = url.href;
      link.textContent = "Open scanned link";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      resultElement.appendChild(link);
    }
  } catch {
    // The QR code contains text rather than a valid URL.
  }

  await stopCamera();
}

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", stopCamera);
</script>

</body>
</html>
