<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 Electrical Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial,sans-serif;background:#f2f6ff;margin:0}

/* HEADER */
.header{
  background:#003f88;
  color:white;
  padding:25px 20px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
}

.header-center{
  text-align:center;
  flex:1;
}

.header h1{margin:0;font-size:36px}
.header p{margin-top:8px;font-size:18px;opacity:.95}
.header .credit{margin-top:6px;font-size:16px;font-weight:500}

/* KPI HEADER BOXES */
.kpi-header{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  max-width:350px;
}

.kpi{
  min-width:140px;
  background:#f8fbff;
  color:#000;
  border-radius:10px;
  padding:10px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  cursor:pointer;
}
.kpi h3{margin:0;font-size:13px;color:#003f88}
.kpi .num{font-size:22px;font-weight:bold;margin-top:5px}
.kpi small{font-size:11px;display:block;margin-top:3px}
.kpi.red{background:#ffeaea;animation:blink 1.2s infinite}
@keyframes blink{50%{background:#ffcccc}}

.kpi-time{
  text-align:center;
  font-size:12px;
  margin-top:10px;
  opacity:.9;
}

/* LAYOUT */
.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:280px 1fr 280px;
  gap:20px
}
.card{
  background:white;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  padding:25px
}
.card h2{margin-top:0;color:#003f88;text-align:center}

/* BUTTONS */
.master-btns,.jobs-btns{
  display:flex;
  flex-direction:column;
  gap:12px
}
button{
  width:100%;
  padding:12px;
  font-size:15px;
  background:#003f88;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer
}
button:hover{opacity:.9}

/* SELECT */
.select-row{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
select{
  padding:12px;
  font-size:16px;
  border-radius:6px;
  border:1px solid #ccc;
  min-width:260px
}

/* ROWS */
.button-row{
  margin-top:20px;
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
.button-row button{width:auto;min-width:150px}

/* FOOTER */
.footer{
  text-align:center;
  padding:15px;
  font-size:14px;
  color:#555
}

@media(max-width:1000px){
  .container{grid-template-columns:1fr}
  .header-top{flex-direction:column;align-items:center}
  .kpi-header{justify-content:center;margin-top:15px}
}
</style>
</head>

<body>

<div class="header">

  <div class="header-top">

    <!-- LEFT KPI -->
    <div class="kpi-header" id="kpiLeft"></div>

    <!-- CENTER TITLE -->
    <div class="header-center">
      <h1>08 Electrical Data</h1>
      <p>Drive Information & Maintenance History</p>
      <div class="credit">
        Designed and Maintained by RAKESH CHANDRA SETHY
      </div>
    </div>

    <!-- RIGHT KPI -->
    <div class="kpi-header" id="kpiRight"></div>

  </div>

  <div class="kpi-time" id="kpiTime"></div>

</div>

<div class="container">

<!-- MASTER LIST -->
<div class="card">
  <h2>Master List</h2>
  <div class="master-btns">
    <button onclick="secureOpen('motor')">⚙️ Motor List</button>
    <button onclick="secureOpen('trafo')">⚡ Transformer List</button>
    <button onclick="secureOpen('breaker')">🔌 Breaker List</button>
    <button onclick="secureOpen('ersmaster')">🗂️ ERS Master</button>
  </div>
</div>

<!-- SELECT DRIVE -->
<div class="card">
  <h2>Select Drive</h2>

  <div class="select-row">
    <select id="mainDrive"><option value="">Select Main Drive</option></select>
    <select id="subDrive"><option value="">Select Sub Drive</option></select>
  </div>

  <div class="button-row">
    <button onclick="secureView('view')">VIEW</button>
    <button onclick="secureView('history')">HISTORY</button>
    <button onclick="secureOpen('jobentry')">📝 NEW JOB ENTRY</button>
  </div>

  <div class="button-row">
    <button onclick="secureOpen('advanced')">📊 Advanced Summary</button>
    <button onclick="openJob1()">📘 Job1 Summary</button>
    <button onclick="openJob2()">📕 Job2 Summary</button>
  </div>

  <!-- ✅ CLEARED AREA FOR FUTURE JOB NATURE TABLE -->
  <div id="futureJobSection"></div>

</div>

<!-- JOBS -->
<div class="card">
  <h2>Jobs</h2>
  <div class="jobs-btns">
    <button onclick="secureOpen('motoroh')">🛠️ Motor O/H Data</button>
    <button onclick="secureOpen('motorpm')">🧾 Motor PM Status</button>
    <button onclick="secureOpen('trafopm')">⚡ Transformer Status</button>
    <button onclick="secureOpen('trafooil')">🛢️ Transformer Oil Report</button>
    <button onclick="secureOpen('breakerpm')">🔌 Breaker PM Status</button>
  </div>
</div>

</div>

<div class="footer">
© 08 Electrical Data | Designed & Maintained by Rakesh Chandra Sethy
</div>

<script>
const DASHBOARD_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/summary.json";

/* KPI LOAD */
async function loadKPI(){
  const j=await (await fetch(DASHBOARD_JSON)).json();

  const left=document.getElementById("kpiLeft");
  const right=document.getElementById("kpiRight");

  const order=[
    ["overdue_motors_oh","Motors O/H","motoroh"],
    ["overdue_motors_pm","Motors PM","motorpm"],
    ["overdue_modules_pm","Modules PM","motorpm"],
    ["overdue_transformers_pm","Transformers PM","trafopm"],
    ["overdue_breaker_pm","Breaker PM","breakerpm"]
  ];

  order.forEach((m,i)=>{
    const data=j.metrics.find(x=>x.key===m[0]);
    if(!data)return;

    const box=document.createElement("div");
    box.className="kpi"+(data.due>0?" red":"");
    box.onclick=()=>secureOpen(m[2]);

    box.innerHTML=`<h3>${m[1]}</h3>
                   <div class="num">${data.due}</div>
                   <small>Installed: ${data.installed}</small>`;

    if(i<3) left.appendChild(box);
    else right.appendChild(box);
  });

  document.getElementById("kpiTime").innerText=
    "Last updated: "+new Date(j.updated).toLocaleString();
}

function secureOpen(type){
  location.href="https://08electricaldata.github.io/drive-viewer/"+type+".html";
}

loadKPI();
</script>

</body>
</html>
