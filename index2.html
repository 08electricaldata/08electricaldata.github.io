<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 Electrical Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:linear-gradient(135deg,#e6f0ff,#f4f9ff);
}

/* PREMIUM HEADER */
.header{
  background:linear-gradient(135deg,#002b5c,#0052cc);
  color:white;
  padding:25px 20px;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

/* CENTER TITLE */
.header-center{
  text-align:center;
  min-width:340px;
}
.header h1{
  margin:0;
  font-size:32px;
  letter-spacing:1px;
}
.header p{
  margin:6px 0 0;
  font-size:15px;
  opacity:.95;
}
.header .credit{
  font-size:14px;
  margin-top:4px;
  opacity:.9;
}

/* KPI PREMIUM BOX */
.kpi-group{
  display:flex;
  gap:10px;
}

.kpi{
  width:140px;
  padding:10px;
  border-radius:14px;
  text-align:center;
  cursor:pointer;

  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 4px 15px rgba(0,0,0,.25);
  transition:all .3s ease;
}

.kpi:hover{
  transform:translateY(-6px) scale(1.05);
  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.kpi h3{
  margin:0;
  font-size:12px;
  color:#fff;
  letter-spacing:.5px;
}

.kpi .num{
  font-size:22px;
  font-weight:bold;
  margin-top:5px;
  color:#fff;
}

.kpi small{
  font-size:11px;
  display:block;
  margin-top:3px;
  color:#e0e0e0;
}

/* RED BLINK */
.kpi.red{
  background:rgba(255,0,0,0.25);
  animation:blink 1.2s infinite;
}
@keyframes blink{
  50%{background:rgba(255,0,0,0.4);}
}

.kpi-time{
  text-align:center;
  font-size:12px;
  margin-top:10px;
  opacity:.9;
}

/* LAYOUT */
.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:280px 1fr 280px;
  gap:20px
}
.card{
  background:white;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  padding:25px;
  transition:.3s;
}
.card:hover{
  box-shadow:0 6px 25px rgba(0,0,0,.25);
}
.card h2{
  margin-top:0;
  color:#003f88;
  text-align:center
}

/* BUTTONS */
.master-btns,.jobs-btns{
  display:flex;
  flex-direction:column;
  gap:12px
}
button{
  width:100%;
  padding:12px;
  font-size:15px;
  background:linear-gradient(135deg,#003f88,#0052cc);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  transform:translateY(-3px);
  box-shadow:0 6px 15px rgba(0,0,0,.25);
}

/* SELECT */
.select-row{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
select{
  padding:12px;
  font-size:16px;
  border-radius:6px;
  border:1px solid #ccc;
  min-width:260px
}

/* ROWS */
.button-row{
  margin-top:20px;
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
.button-row button{width:auto;min-width:150px}

/* FOOTER */
.footer{
  text-align:center;
  padding:15px;
  font-size:14px;
  color:#555
}

@media(max-width:1200px){
  .header-row{flex-wrap:wrap;justify-content:center}
  .kpi-group{flex-wrap:wrap;justify-content:center}
}
@media(max-width:1000px){
  .container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="header">
  <div class="header-row">

    <!-- LEFT 3 KPI -->
    <div class="kpi-group" id="kpiLeft"></div>

    <!-- CENTER TITLE -->
    <div class="header-center">
      <h1>08 Electrical Data</h1>
      <p>Drive Information & Maintenance History</p>
      <div class="credit">
        Designed and Maintained by RAKESH CHANDRA SETHY
      </div>
    </div>

    <!-- RIGHT 2 KPI -->
    <div class="kpi-group" id="kpiRight"></div>

  </div>
  <div class="kpi-time" id="kpiTime"></div>
</div>

<div class="container">

<div class="card">
  <h2>Master List</h2>
  <div class="master-btns">
    <button onclick="secureOpen('motor')">⚙️ Motor List</button>
    <button onclick="secureOpen('trafo')">⚡ Transformer List</button>
    <button onclick="secureOpen('breaker')">🔌 Breaker List</button>
    <button onclick="secureOpen('ersmaster')">🗂️ ERS Master</button>
  </div>
</div>

<div class="card">
  <h2>Select Drive</h2>

  <div class="select-row">
    <select id="mainDrive"><option>Select Main Drive</option></select>
    <select id="subDrive"><option>Select Sub Drive</option></select>
  </div>

  <div class="button-row">
    <button>VIEW</button>
    <button>HISTORY</button>
    <button>📝 NEW JOB ENTRY</button>
  </div>

  <div class="button-row">
    <button>📊 Advanced Summary</button>
    <button>📘 Job1 Summary</button>
    <button>📕 Job2 Summary</button>
  </div>

  <div id="futureJobSection"></div>

</div>

<div class="card">
  <h2>Jobs</h2>
  <div class="jobs-btns">
    <button onclick="secureOpen('motoroh')">🛠️ Motor O/H Data</button>
    <button onclick="secureOpen('motorpm')">🧾 Motor PM Status</button>
    <button onclick="secureOpen('trafopm')">⚡ Transformer Status</button>
    <button onclick="secureOpen('trafooil')">🛢️ Transformer Oil Report</button>
    <button onclick="secureOpen('breakerpm')">🔌 Breaker PM Status</button>
  </div>
</div>

</div>

<div class="footer">
© 08 Electrical Data | Designed & Maintained by Rakesh Chandra Sethy
</div>

<script>
const DASHBOARD_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/summary.json";

/* PASSWORD */
function checkPassword(){
  const p=prompt("🔐 Enter Password");
  if(p===null || p.trim()!=="1234"){   // replace with your real password logic
    alert("❌ Incorrect password");
    return false;
  }
  return true;
}

/* OPEN WITH PASSWORD */
function secureOpen(type){
  if(!checkPassword()) return;

  const map={
    motoroh:"drive-viewer/motoroh.html",
    motorpm:"drive-viewer/motorpm.html",
    trafopm:"drive-viewer/trafopm.html",
    breakerpm:"drive-viewer/breakerpm.html"
  };

  if(map[type]){
    location.href="https://08electricaldata.github.io/"+map[type];
  }
}

/* LOAD KPI */
async function loadKPI(){
  const j=await (await fetch(DASHBOARD_JSON)).json();

  const left=document.getElementById("kpiLeft");
  const right=document.getElementById("kpiRight");

  const order=[
    ["overdue_motors_oh","Motors O/H","motoroh"],
    ["overdue_motors_pm","Motors PM","motorpm"],
    ["overdue_modules_pm","Modules PM","motorpm"],
    ["overdue_transformers_pm","Transformers PM","trafopm"],
    ["overdue_breaker_pm","Breaker PM","breakerpm"]
  ];

  order.forEach((m,i)=>{
    const data=j.metrics.find(x=>x.key===m[0]);
    if(!data)return;

    const box=document.createElement("div");
    box.className="kpi"+(data.due>0?" red":"");
    box.onclick=()=>secureOpen(m[2]);

    box.innerHTML=`<h3>${m[1]}</h3>
                   <div class="num">${data.due}</div>
                   <small>Installed: ${data.installed}</small>`;

    if(i<3) left.appendChild(box);
    else right.appendChild(box);
  });

  document.getElementById("kpiTime").innerText=
    "Last updated: "+new Date(j.updated).toLocaleString();
}

loadKPI();
</script>

</body>
</html>
