<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 Electrical Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial,sans-serif;background:#f2f6ff;margin:0}

/* HEADER */
.header{
  background:#003f88;
  color:white;
  padding:20px 15px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

/* CENTER TITLE */
.header-center{
  text-align:center;
  min-width:320px;
}
.header h1{margin:0;font-size:30px}
.header p{margin:4px 0 0;font-size:15px}
.header .credit{font-size:14px;margin-top:3px}

/* KPI BOXES */
.kpi-group{
  display:flex;
  gap:8px;
}

.kpi{
  width:130px;
  background:white;
  color:#000;
  border-radius:8px;
  padding:8px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
  cursor:pointer;
}
.kpi h3{
  margin:0;
  font-size:12px;
  color:#003f88;
}
.kpi .num{
  font-size:20px;
  font-weight:bold;
  margin-top:4px;
}
.kpi small{
  font-size:10px;
  display:block;
  margin-top:2px;
}
.kpi.red{
  background:#ffeaea;
  animation:blink 1.2s infinite;
}
@keyframes blink{50%{background:#ffcccc}}

.kpi-time{
  text-align:center;
  font-size:11px;
  margin-top:6px;
  opacity:.9;
}

/* LAYOUT */
.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:280px 1fr 280px;
  gap:20px
}
.card{
  background:white;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  padding:25px
}
.card h2{margin-top:0;color:#003f88;text-align:center}

/* BUTTONS */
.master-btns,.jobs-btns{
  display:flex;
  flex-direction:column;
  gap:12px
}
button{
  width:100%;
  padding:12px;
  font-size:15px;
  background:#003f88;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer
}
button:hover{opacity:.9}

/* SELECT */
.select-row{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
select{
  padding:12px;
  font-size:16px;
  border-radius:6px;
  border:1px solid #ccc;
  min-width:260px
}

/* ROWS */
.button-row{
  margin-top:20px;
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
.button-row button{width:auto;min-width:150px}

/* FOOTER */
.footer{
  text-align:center;
  padding:15px;
  font-size:14px;
  color:#555
}

@media(max-width:1200px){
  .header-row{flex-wrap:wrap;justify-content:center}
  .kpi-group{flex-wrap:wrap;justify-content:center}
}
@media(max-width:1000px){
  .container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="header">

  <div class="header-row">

    <!-- LEFT 3 KPI -->
    <div class="kpi-group" id="kpiLeft"></div>

    <!-- CENTER TITLE -->
    <div class="header-center">
      <h1>08 Electrical Data</h1>
      <p>Drive Information & Maintenance History</p>
      <div class="credit">
        Designed and Maintained by RAKESH CHANDRA SETHY
      </div>
    </div>

    <!-- RIGHT 2 KPI -->
    <div class="kpi-group" id="kpiRight"></div>

  </div>

  <div class="kpi-time" id="kpiTime"></div>

</div>

<div class="container">

<!-- MASTER LIST -->
<div class="card">
  <h2>Master List</h2>
  <div class="master-btns">
    <button onclick="secureOpen('motorlist')">⚙️ Motor List</button>
    <button onclick="secureOpen('trafolist')">⚡ Transformer List</button>
    <button onclick="secureOpen('breakerlist')">🔌 Breaker List</button>
    <button onclick="secureOpen('ersmasterdata')">🗂️ ERS Master</button>
  </div>
</div>

<!-- SELECT DRIVE -->
<div class="card">
  <h2>Select Drive</h2>

  <div class="select-row">
    <select><option>Select Main Drive</option></select>
    <select><option>Select Sub Drive</option></select>
  </div>

  <div class="button-row">
    <button>VIEW</button>
    <button>HISTORY</button>
    <button>📝 NEW JOB ENTRY</button>
  </div>

  <div class="button-row">
    <button>📊 Advanced Summary</button>
    <button>📘 Job1 Summary</button>
    <button>📕 Job2 Summary</button>
  </div>

  <!-- Cleared for future Job Nature Table -->
  <div id="futureJobSection"></div>

</div>

<!-- JOBS -->
<div class="card">
  <h2>Jobs</h2>
  <div class="jobs-btns">
    <button>🛠️ Motor O/H Data</button>
    <button>🧾 Motor PM Status</button>
    <button>⚡ Transformer Status</button>
    <button>🛢️ Transformer Oil Report</button>
    <button>🔌 Breaker PM Status</button>
  </div>
</div>

</div>

<div class="footer">
© 08 Electrical Data | Designed & Maintained by Rakesh Chandra Sethy
</div>

<script>
const DASHBOARD_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/summary.json";

async function loadKPI(){
  const j=await (await fetch(DASHBOARD_JSON)).json();

  const left=document.getElementById("kpiLeft");
  const right=document.getElementById("kpiRight");

  const order=[
    ["overdue_motors_oh","Motors O/H"],
    ["overdue_motors_pm","Motors PM"],
    ["overdue_modules_pm","Modules PM"],
    ["overdue_transformers_pm","Transformers PM"],
    ["overdue_breaker_pm","Breaker PM"]
  ];

  order.forEach((m,i)=>{
    const data=j.metrics.find(x=>x.key===m[0]);
    if(!data)return;

    const box=document.createElement("div");
    box.className="kpi"+(data.due>0?" red":"");

    box.innerHTML=`<h3>${m[1]}</h3>
                   <div class="num">${data.due}</div>
                   <small>Installed: ${data.installed}</small>`;

    if(i<3) left.appendChild(box);
    else right.appendChild(box);
  });

  document.getElementById("kpiTime").innerText=
    "Last updated: "+new Date(j.updated).toLocaleString();
}

loadKPI();
</script>

</body>
</html>
