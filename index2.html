<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 Electrical Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===== GLOBAL ===== */
body{
  font-family: 'Segoe UI', Arial, sans-serif;
  margin:0;
  background:linear-gradient(135deg,#dfe9f3,#ffffff);
  overflow-x:hidden;
}

/* ===== PREMIUM HEADER ===== */
.header{
  background:linear-gradient(-45deg,#001f3f,#003f88,#0052cc,#001f3f);
  background-size:400% 400%;
  animation:gradientFlow 12s ease infinite;
  color:white;
  padding:30px 20px;
  box-shadow:0 6px 25px rgba(0,0,0,.3);
}
@keyframes gradientFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.header-center{text-align:center;min-width:340px;}
.header h1{margin:0;font-size:34px;letter-spacing:1px}
.header p{margin:6px 0 0;font-size:15px}
.header .credit{font-size:13px;margin-top:4px;opacity:.85}

/* ===== KPI GLASS PREMIUM ===== */
.kpi-group{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.kpi{
  width:145px;
  padding:12px;
  border-radius:18px;
  text-align:center;
  cursor:pointer;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  transition:.4s;
}
.kpi:hover{
  transform:translateY(-8px) scale(1.08);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.kpi h3{margin:0;font-size:12px;color:#fff}
.kpi .num{font-size:24px;font-weight:bold;margin-top:5px;color:#fff}
.kpi small{font-size:11px;display:block;margin-top:3px;color:#eee}

.kpi.red{
  background:rgba(255,0,0,0.25);
  animation:blink 1.2s infinite;
}
@keyframes blink{50%{background:rgba(255,0,0,0.45)}}

.kpi-time{text-align:center;font-size:12px;margin-top:10px}

/* ===== LAYOUT ===== */
.container{
  max-width:1300px;
  margin:35px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:300px 1fr 300px;
  gap:25px
}
.card{
  background:rgba(255,255,255,.85);
  border-radius:18px;
  backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(0,0,0,.15);
  padding:28px;
  transition:.3s;
}
.card:hover{box-shadow:0 12px 35px rgba(0,0,0,.25)}
.card h2{margin-top:0;color:#003f88;text-align:center}

/* ===== BUTTONS ===== */
.master-btns,.jobs-btns{display:flex;flex-direction:column;gap:14px}
button{
  width:100%;
  padding:13px;
  font-size:15px;
  background:linear-gradient(135deg,#003f88,#0052cc);
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  transition:.4s;
}
button:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 20px rgba(0,0,0,.25);
}

/* ===== SELECT ===== */
.select-row{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
select{
  padding:12px;font-size:15px;border-radius:8px;
  border:1px solid #ccc;min-width:260px
}
.button-row{
  margin-top:20px;display:flex;
  gap:15px;justify-content:center;flex-wrap:wrap
}
.button-row button{width:auto;min-width:150px}

/* ===== MONTHLY PREMIUM TABLE ===== */
.monthly-table{margin-top:30px;overflow-x:auto;animation:fadeIn .8s ease}
.monthly-table table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
.monthly-table th{
  background:linear-gradient(135deg,#003f88,#0052cc);
  color:white;
  padding:10px;
  text-align:center;
}
.monthly-table td{
  padding:8px;
  text-align:center;
  border-bottom:1px solid #ddd;
  transition:.5s;
}
.monthly-table td:first-child{
  text-align:left;
  font-weight:bold;
}
.monthly-table tr:hover{background:#f2f6ff}

/* Trend colors */
.increase{background:#d4f8d4;color:#0a7a0a;font-weight:bold}
.decrease{background:#ffd6d6;color:#b00000;font-weight:bold}
.same{background:#f0f0f0;color:#555;font-weight:bold}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* Responsive */
@media(max-width:1000px){
  .container{grid-template-columns:1fr}
}

.footer{text-align:center;padding:15px;font-size:14px;color:#555}

</style>
</head>

<body>

<div class="header">
  <div class="header-row">
    <div class="kpi-group" id="kpiLeft"></div>

    <div class="header-center">
      <h1>08 Electrical Data</h1>
      <p>Drive Information & Maintenance History</p>
      <div class="credit">Designed and Maintained by RAKESH CHANDRA SETHY</div>
    </div>

    <div class="kpi-group" id="kpiRight"></div>
  </div>
  <div class="kpi-time" id="kpiTime"></div>
</div>

<div class="container">

<!-- LEFT -->
<div class="card">
  <h2>Master List</h2>
  <div class="master-btns">
    <button onclick="secureOpen('motor')">⚙️ Motor List</button>
    <button onclick="secureOpen('trafo')">⚡ Transformer List</button>
    <button onclick="secureOpen('breaker')">🔌 Breaker List</button>
    <button onclick="secureOpen('ersmaster')">🗂️ ERS Master</button>
  </div>
</div>

<!-- CENTER -->
<div class="card">
  <h2>Select Drive</h2>

  <div class="select-row">
    <select id="mainDrive"><option value="">Select Main Drive</option></select>
    <select id="subDrive"><option value="">Select Sub Drive</option></select>
  </div>

  <div class="button-row">
    <button onclick="secureView('view')">VIEW</button>
    <button onclick="secureView('history')">HISTORY</button>
    <button onclick="secureOpen('jobentry')">📝 NEW JOB ENTRY</button>
  </div>

  <div class="button-row">
    <button onclick="secureOpen('advanced')">📊 Advanced Summary</button>
    <button onclick="openJob1()">📘 Job1 Summary</button>
    <button onclick="openJob2()">📕 Job2 Summary</button>
  </div>

  <div id="monthlyJobTable"></div>
</div>

<!-- RIGHT -->
<div class="card">
  <h2>Jobs</h2>
  <div class="jobs-btns">
    <button onclick="secureOpen('motoroh')">🛠️ Motor O/H Data</button>
    <button onclick="secureOpen('motorpm')">🧾 Motor PM Status</button>
    <button onclick="secureOpen('trafopm')">⚡ Transformer Status</button>
    <button onclick="secureOpen('trafooil')">🛢️ Transformer Oil Report</button>
    <button onclick="secureOpen('breakerpm')">🔌 Breaker PM Status</button>
  </div>
</div>

</div>

<div class="footer">
© 08 Electrical Data | Designed & Maintained by Rakesh Chandra Sethy
</div>

<script>

const DRIVE_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dropdown/drives.json";

const DASHBOARD_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/summary.json";

const MONTHLY_JOB_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/monthly_job_count.json";

let headers=[],rows=[],sheetPassword="";

/* ===== DRIVE LOAD ===== */
async function loadSheet(){
  const d=await (await fetch(DRIVE_JSON)).json();
  headers=d.headers;
  rows=d.rows;
  sheetPassword=String(headers[6]||"").trim();
  buildMain();
}

function buildMain(){
  const mainDrive=document.getElementById("mainDrive");
  headers.forEach((h,i)=>{
    if(i<7||!h)return;
    const o=document.createElement("option");
    o.value=i;
    o.textContent=h;
    mainDrive.appendChild(o);
  });
}

document.getElementById("mainDrive").onchange=function(){
  const subDrive=document.getElementById("subDrive");
  subDrive.innerHTML="<option value=''>Select Sub Drive</option>";
  rows.forEach(r=>{
    if(r[this.value]){
      const o=document.createElement("option");
      o.value=r[this.value];
      o.textContent=r[this.value];
      subDrive.appendChild(o);
    }
  });
};

/* ===== PASSWORD ===== */
function checkPassword(){
  if(!sheetPassword){alert("⏳ Data loading");return false}
  const p=prompt("🔐 Enter Password");
  if(p===null||p.trim()!==sheetPassword){
    alert("❌ Incorrect password");
    return false;
  }
  return true;
}

/* ===== OPEN ===== */
function secureOpen(type){
  if(!checkPassword())return;
  const map={
    motor:"drive-viewer/motorlist.html",
    trafo:"drive-viewer/trafolist.html",
    breaker:"drive-viewer/breakerlist.html",
    ersmaster:"drive-viewer/ersmasterdata.html",
    advanced:"drive-viewer/summary-advanced.html",
    motoroh:"drive-viewer/motoroh.html",
    motorpm:"drive-viewer/motorpm.html",
    trafopm:"drive-viewer/trafopm.html",
    trafooil:"drive-viewer/transformer-oil-summary.html",
    breakerpm:"drive-viewer/breakerpm.html",
    jobentry:"jobsubmit.html"
  };
  location.href="https://08electricaldata.github.io/"+map[type];
}

function openJob1(){ if(checkPassword()) location.href="https://08electricaldata.github.io/drive-viewer/summeryjobwise1.html";}
function openJob2(){ if(checkPassword()) location.href="https://08electricaldata.github.io/drive-viewer/summeryjobwise.html";}

/* ===== KPI LOAD ===== */
async function loadKPI(){
  const j=await (await fetch(DASHBOARD_JSON)).json();
  const left=document.getElementById("kpiLeft");
  const right=document.getElementById("kpiRight");

  const map={
    overdue_motors_oh:["Motors O/H","motoroh"],
    overdue_motors_pm:["Motors PM","motorpm"],
    overdue_modules_pm:["Modules PM","motorpm"],
    overdue_transformers_pm:["Transformers PM","trafopm"],
    overdue_breaker_pm:["Breaker PM","breakerpm"]
  };

  let index=0;
  j.metrics.forEach(m=>{
    if(!map[m.key])return;
    const box=document.createElement("div");
    box.className="kpi"+(m.due>0?" red":"");
    box.onclick=()=>secureOpen(map[m.key][1]);
    box.innerHTML=`<h3>${map[m.key][0]}</h3>
                   <div class="num">${m.due}</div>
                   <small>Installed: ${m.installed}</small>`;
    if(index<3) left.appendChild(box);
    else right.appendChild(box);
    index++;
  });

  document.getElementById("kpiTime").innerText=
    "Last updated: "+new Date(j.updated).toLocaleString();
}

/* ===== MONTHLY PREMIUM TABLE ===== */
async function loadMonthlyJobTable(){
  const res=await fetch(MONTHLY_JOB_JSON);
  const data=await res.json();
  const headers=data.headers;
  const rows=data.rows;

  const last=headers.length-1;
  const prev=headers.length-2;

  const lastMonth=new Date(headers[last]).toLocaleString('default',{month:'short'});
  const prevMonth=new Date(headers[prev]).toLocaleString('default',{month:'short'});

  let html=`<div class="monthly-table"><table>
  <tr><th>Job Type</th><th>${prevMonth}</th><th>${lastMonth}</th></tr>`;

  rows.forEach(r=>{
    const p=Number(r[prev])||0;
    const l=Number(r[last])||0;
    if(p===0&&l===0)return;

    let cls="same",arrow="→";
    if(l>p){cls="increase";arrow="↑"}
    else if(l<p){cls="decrease";arrow="↓"}

    html+=`<tr>
    <td>${r[0]}</td>
    <td>${p>0?p:""}</td>
    <td class="${cls}">${l>0?l:""} ${arrow}</td>
    </tr>`;
  });

  html+="</table></div>";
  document.getElementById("monthlyJobTable").innerHTML=html;
}

/* ===== INIT ===== */
loadSheet();
loadKPI();
loadMonthlyJobTable();

</script>

</body>
</html>
