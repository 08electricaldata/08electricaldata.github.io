<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 Electrical Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f6ff;
  margin: 0;
}

/* HEADER */
.header {
  background: #003f88;
  color: white;
  padding: 30px 15px;
  text-align: center;
}
.header h1 { margin: 0; font-size: 36px; }
.header p { margin-top: 8px; font-size: 18px; opacity: 0.95; }
.header .credit { margin-top: 6px; font-size: 16px; font-weight: 500; }

/* LAYOUT */
.container {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 15px;
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  gap: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  padding: 25px;
}

.card h2 {
  margin-top: 0;
  color: #003f88;
  text-align: center;
}

/* BUTTONS */
.master-btns,
.jobs-btns {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

button {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  background: #003f88;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:hover { opacity: 0.9; }

/* SELECT */
.select-row {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

select {
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
  min-width: 260px;
}

/* BUTTON ROWS */
.button-row {
  margin-top: 20px;
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}
.button-row button {
  width: auto;
  min-width: 150px;
}

/* KPI */
.kpi-wrap { display:flex; flex-direction:column; gap:12px; }

.kpi {
  background:#f8fbff;
  border-radius:10px;
  padding:14px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
  cursor:pointer;
}
.kpi h3 { margin:0; font-size:14px; color:#003f88; }
.kpi .num { font-size:26px; font-weight:bold; margin-top:6px; }
.kpi small { font-size:12px; display:block; margin-top:4px; }

.kpi.red {
  background:#ffeaea;
  animation:blink 1.2s infinite;
}
@keyframes blink { 50% { background:#ffcccc; } }

.kpi button {
  margin-top:6px;
  padding:6px;
  background:#25D366;
  font-size:13px;
}

/* TREND */
.trend-card {
  background:white;
  border-radius:10px;
  padding:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.trend-card h3 {
  margin:0 0 10px;
  color:#003f88;
  text-align:center;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 15px;
  font-size: 14px;
  color: #555;
}

/* RESPONSIVE */
@media (max-width: 1000px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="header">
  <h1>08 Electrical Data</h1>
  <p>Drive Information & Maintenance History</p>
  <div class="credit">Designed and Maintained by RAKESH CHANDRA SETHY</div>
</div>

<div class="container">

<!-- MASTER LIST -->
<div class="card">
  <h2>Master List</h2>
  <div class="master-btns">
    <button onclick="secureOpen('motor')">⚙️ Motor List</button>
    <button onclick="secureOpen('trafo')">⚡ Transformer List</button>
    <button onclick="secureOpen('breaker')">🔌 Breaker List</button>
  </div>
</div>

<!-- SELECT DRIVE -->
<div class="card">
  <h2>Select Drive</h2>

  <div class="select-row">
    <select id="mainDrive">
      <option value="">Select Main Drive</option>
    </select>
    <select id="subDrive">
      <option value="">Select Sub Drive</option>
    </select>
  </div>

  <div class="button-row">
    <button onclick="secureView('view')">VIEW</button>
    <button onclick="secureView('history')">HISTORY</button>
    <button onclick="secureOpen('jobentry')">📝 NEW JOB ENTRY</button>
  </div>

  <div class="button-row">
    <button onclick="secureOpen('advanced')">📊 Advanced Summary</button>
    <button onclick="openJob1()">📘 Job1 Summary</button>
    <button onclick="openJob2()">📕 Job2 Summary</button>
  </div>
</div>

<!-- JOBS + KPI -->
<div class="card">
  <h2>Jobs Dashboard</h2>

  <div class="kpi-wrap" id="kpiBox">
    <div class="kpi"><h3>Loading KPIs…</h3></div>
  </div>

  <div class="trend-card" style="margin-top:16px">
    <h3>📊 Monthly PM Due Trend</h3>
    <canvas id="trendCanvas" height="120"></canvas>
  </div>

  <hr style="margin:18px 0">

  <div class="jobs-btns">
    <button onclick="secureOpen('motoroh')">🛠️ Motor O/H Data</button>
    <button onclick="secureOpen('motorpm')">🧾 Motor PM Status</button>
    <button onclick="secureOpen('trafopm')">⚡ Transformer Status</button>
    <button onclick="secureOpen('breakerpm')">🔌 Breaker PM Status</button>
  </div>
</div>

</div>

<div class="footer">
  © 08 Electrical Data | Designed & Maintained by Rakesh Chandra Sethy (08 Electrical)
</div>

<script>
const JSON_URL =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dropdown/drives.json";
const DASHBOARD_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dashboard/summary.json";

let headers=[], rows=[], sheetPassword="";

/* LOAD DRIVE JSON */
async function loadSheet(){
  const d=await (await fetch(JSON_URL)).json();
  headers=d.headers; rows=d.rows;
  sheetPassword=String(headers[6]||"").trim();
  buildMain();
}

/* PASSWORD */
function checkPassword(){
  const p=prompt("🔐 Enter Password");
  return p && p.trim()===sheetPassword;
}

/* BUILD DROPDOWNS */
function buildMain(){
  mainDrive.innerHTML="<option value=''>Select Main Drive</option>";
  headers.forEach((h,i)=>{
    if(i<7||!h) return;
    const o=document.createElement("option");
    o.value=i; o.textContent=h; mainDrive.appendChild(o);
  });
}
mainDrive.onchange=()=>{
  subDrive.innerHTML="<option value=''>Select Sub Drive</option>";
  rows.forEach(r=>{
    if(r[mainDrive.value]){
      const o=document.createElement("option");
      o.value=r[mainDrive.value]; o.textContent=r[mainDrive.value];
      subDrive.appendChild(o);
    }
  });
};

/* NAV */
function secureView(t){
  if(!checkPassword()) return;
  const id=mainDrive.selectedOptions[0].text+"-"+subDrive.value;
  location.href="https://08electricaldata.github.io/"+
    (t==="view"?"drive-viewer/index.html?id=":"drive-viewer/history.html?id=")+encodeURIComponent(id);
}
function secureOpen(p){
  if(!checkPassword()) return;
  location.href="https://08electricaldata.github.io/drive-viewer/"+p+".html";
}
function openJob1(){ if(checkPassword()) location.href="https://08electricaldata.github.io/drive-viewer/summeryjobwise1.html"; }
function openJob2(){ if(checkPassword()) location.href="https://08electricaldata.github.io/drive-viewer/summeryjobwise.html"; }

/* KPI */
async function loadDashboardKPI(){
  const j=await (await fetch(DASHBOARD_JSON)).json();
  const box=document.getElementById("kpiBox");
  box.innerHTML="";
  const map={
    overdue_motors_oh:["Overdue Motors O/H","motoroh"],
    overdue_motors_pm:["Overdue Motors PM","motorpm"],
    overdue_modules_pm:["Overdue Modules PM","motorpm"],
    overdue_transformers_pm:["Transformer PM","trafopm"],
    overdue_breaker_pm:["Breaker PM","breakerpm"]
  };
  j.metrics.forEach(m=>{
    if(!map[m.key]) return;
    const d=document.createElement("div");
    d.className="kpi"+(m.due>0?" red":"");
    d.onclick=()=>secureOpen(map[m.key][1]);
    d.innerHTML=`<h3>${map[m.key][0]}</h3><div class="num">${m.due}</div><small>Installed: ${m.installed}</small>`;
    box.appendChild(d);
  });
  const t=document.createElement("small");
  t.style.textAlign="center";
  t.innerText="Updated: "+new Date(j.updated).toLocaleString();
  box.appendChild(t);
}

/* TREND (placeholder – fast) */
function drawTrend(){
  const c=document.getElementById("trendCanvas");
  const ctx=c.getContext("2d");
  const d=[30,42,28,50,38,46];
  const max=Math.max(...d);
  ctx.beginPath();
  d.forEach((v,i)=>{
    const x=i*(c.width/(d.length-1));
    const y=c.height-(v/max)*c.height;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.strokeStyle="#003f88"; ctx.stroke();
}

loadSheet();
loadDashboardKPI();
drawTrend();
</script>

</body>
</html>
