<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 Electrical Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:linear-gradient(135deg,#e6f0ff,#f4f9ff);
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#002b5c,#0052cc);
  color:white;
  padding:25px 20px;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}
.header-row{
  display:flex;
  justify-content:center;
}
.header-center{text-align:center}
.header h1{margin:0;font-size:32px}
.header p{margin:6px 0 0;font-size:15px}
.header .credit{font-size:14px;margin-top:4px}

/* 🟢 FLOATING ROUND SCAN BUTTON */
.floating-scan{
  position:fixed;
  right:25px;
  bottom:25px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:linear-gradient(135deg,#00c853,#00e676);
  color:white;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  animation:floatPulse 2s infinite;
  z-index:1000;
}
.floating-scan:hover{
  transform:scale(1.1);
}

@keyframes floatPulse{
  0%{box-shadow:0 0 0 0 rgba(0,200,83,.7);}
  70%{box-shadow:0 0 0 20px rgba(0,200,83,0);}
  100%{box-shadow:0 0 0 0 rgba(0,200,83,0);}
}

/* LAYOUT */
.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:280px 1fr 280px;
  gap:20px
}
.card{
  background:white;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  padding:25px;
}
.card h2{margin-top:0;color:#003f88;text-align:center}

/* BUTTONS */
.master-btns,.jobs-btns{
  display:flex;
  flex-direction:column;
  gap:12px
}
button{
  width:100%;
  padding:12px;
  font-size:15px;
  background:linear-gradient(135deg,#003f88,#0052cc);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* CUSTOM DROPDOWN */
.select-row{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
.dropdown{
  position:relative;
  min-width:260px;
}
.dropdown input{
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
}
.dropdown-list{
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  max-height:220px;
  overflow-y:auto;
  background:white;
  border:1px solid #ccc;
  border-top:none;
  display:none;
  z-index:999;
}
.dropdown-list div{
  padding:10px;
  cursor:pointer;
}
.dropdown-list div:hover{
  background:#e6f0ff;
}

.button-row{
  margin-top:20px;
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}
.button-row button{width:auto;min-width:150px}

.footer{
  text-align:center;
  padding:15px;
  font-size:14px;
  color:#555
}

@media(max-width:1000px){
  .container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="header">
  <div class="header-row">
    <div class="header-center">
      <h1>08 Electrical Data</h1>
      <p>Drive Information & Maintenance History</p>
      <div class="credit">Designed and Maintained by RAKESH CHANDRA SETHY</div>
    </div>
  </div>
</div>

<div class="container">

<!-- MASTER -->
<div class="card">
  <h2>Master List</h2>
  <div class="master-btns">
    <button onclick="secureOpen('motor')">⚙️ Motor List</button>
    <button onclick="secureOpen('trafo')">⚡ Transformer List</button>
    <button onclick="secureOpen('breaker')">🔌 Breaker List</button>
    <button onclick="secureOpen('ersmaster')">🗂️ ERS Master</button>
  </div>
</div>

<!-- SELECT DRIVE -->
<div class="card">
  <h2>Select Drive</h2>
  <div class="select-row">
    <div class="dropdown">
      <input id="mainDrive" placeholder="Select / Type Main Drive">
      <div class="dropdown-list" id="mainList"></div>
    </div>
    <div class="dropdown">
      <input id="subDrive" placeholder="Select / Type Sub Drive">
      <div class="dropdown-list" id="subList"></div>
    </div>
  </div>
  <div class="button-row">
    <button onclick="secureView('view')">VIEW</button>
    <button onclick="secureView('history')">HISTORY</button>
    <button onclick="secureOpen('jobentry')">📝 NEW JOB ENTRY</button>
  </div>
  <div class="button-row">
    <button onclick="secureOpen('advanced')">📊 Advanced Summary</button>
    <button onclick="openJob1()">📘 Job1 Summary</button>
    <button onclick="openJob2()">📕 Job2 Summary</button>
  </div>
</div>

<!-- JOBS -->
<div class="card">
  <h2>Jobs</h2>
  <div class="jobs-btns">
    <button onclick="openMonthlyTrend()">📈 Monthly Job Trend</button>
    <button onclick="secureOpen('motoroh')">🛠️ Motor O/H Data</button>
    <button onclick="secureOpen('motorpm')">🧾 Motor PM Status</button>
    <button onclick="secureOpen('trafopm')">⚡ Transformer Status</button>
    <button onclick="secureOpen('trafooil')">🛢️ Transformer Oil Report</button>
    <button onclick="secureOpen('breakerpm')">🔌 Breaker PM Status</button>
  </div>
</div>

</div>

<div class="footer">
© 08 Electrical Data | Designed & Maintained by Rakesh Chandra Sethy
</div>

<!-- 🟢 Floating Scanner Button -->
<div class="floating-scan" onclick="openScanner()">📷</div>

<script>

function openScanner(){
  location.href="https://08electricaldata.github.io/scanview.html";
}

</body>
</html>
