<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 Electrical Data</title>

<style>
* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #fff;
  background: linear-gradient(135deg, #e6f0ff, #f4f9ff);
}

.container {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
}

.top-nav {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

button {
  min-height: 48px;
  padding: 12px 16px;
  border: 0;
  border-radius: 10px;
  color: #fff;
  background: linear-gradient(135deg, #003f88, #0052cc);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}

.top-nav button {
  flex: 1;
}

.credit {
  margin: 14px 0 30px;
  color: #003f88;
  font-size: 13px;
  text-align: center;
}

.card {
  padding: 24px 18px;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.card h1 {
  margin: 0 0 22px;
  color: #003f88;
  font-size: 22px;
  text-align: center;
}

.action-buttons {
  display: grid;
  gap: 14px;
}

.action-buttons button {
  min-height: 56px;
  font-size: 17px;
}

button:hover {
  opacity: 0.9;
}

button:focus-visible {
  outline: 3px solid #ffbf47;
  outline-offset: 3px;
}

@media (max-width: 360px) {
  body {
    padding: 14px;
  }

  .card {
    padding: 20px 14px;
  }

  .credit {
    font-size: 12px;
  }
}
</style>
</head>

<body>
  <main class="container">
    <nav class="top-nav" aria-label="Page navigation">
      <button type="button" onclick="history.back()">⬅ Back</button>
      <button type="button" onclick="location.href='https://08electricaldata.github.io/index_mob.html'">🏠 Home</button>
    </nav>

    <div class="credit">Designed and Maintained by Rakesh Chandra Sethy</div>

    <section class="card">
      <h1>08 Electrical Data</h1>

      <div class="action-buttons">
        <button type="button" onclick="location.href='https://08electricaldata.github.io/scanview.html'">
          VIEW
        </button>
        <button type="button" onclick="location.href='https://08electricaldata.github.io/scanjob.html'">
          JOB SUBMIT
        </button>
      </div>
    </section>
  </main>
</body>
</html>
