<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>08 Electrical Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:linear-gradient(135deg,#e6f0ff,#f4f9ff);
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#002b5c,#0052cc);
  color:white;
  padding:25px 20px;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
  position:relative;
}
.header-row{
  display:flex;
  justify-content:center;
}
.header-center{text-align:center}
.header h1{margin:0;font-size:32px}
.header p{margin:6px 0 0;font-size:15px}
.header .credit{font-size:14px;margin-top:4px}

/* 🔵 GLOWING HEADER SCAN BUTTON */
.scan-icon{
  position:absolute;
  left:20px;
  top:28px;
  cursor:pointer;
  font-size:26px;
  background:white;
  color:#003f88;
  padding:10px 14px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,82,204,.8);
  animation:glowPulse 1.8s infinite alternate;
  transition:.3s;
}
.scan-icon:hover{
  transform:scale(1.1);
}

@keyframes glowPulse{
  from{box-shadow:0 0 10px rgba(0,82,204,.6);}
  to{box-shadow:0 0 25px rgba(0,82,204,1);}
}

/* 🟢 FLOATING ROUND BUTTON */
.floating-scan{
  position:fixed;
  right:25px;
  bottom:25px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:linear-gradient(135deg,#00c853,#00e676);
  color:white;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  animation:floatPulse 2s infinite;
  z-index:1000;
}
.floating-scan:hover{
  transform:scale(1.1);
}

@keyframes floatPulse{
  0%{box-shadow:0 0 0 0 rgba(0,200,83,.7);}
  70%{box-shadow:0 0 0 20px rgba(0,200,83,0);}
  100%{box-shadow:0 0 0 0 rgba(0,200,83,0);}
}

/* LAYOUT - DESKTOP */
.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:1fr;
  gap:20px
}
.card{
  background:white;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  padding:25px;
}
.card h2{margin-top:0;color:#003f88;text-align:center;font-size:18px}

/* BUTTONS - GRID LAYOUT 3 COLUMNS */
.master-btns, .jobs-btns{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
}

/* Select drive layout */
.drive-inputs{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  margin-bottom:15px;
  align-items: stretch;
}

.drive-action-buttons{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:10px;
  margin-bottom:15px;
}

.select-row{
  display:flex;
  gap:15px;
  justify-content:center;
  flex-wrap:wrap
}

button{
  padding:10px 8px;
  font-size:13px;
  background:linear-gradient(135deg,#003f88,#0052cc);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  white-space:normal;
  word-wrap:break-word;
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

button:hover{
  opacity:0.9;
}

/* 🗄️ Board Button Special Color */
.board-btn{
  background:linear-gradient(135deg,#ff8c00,#ffb347);
  font-weight:bold;
}
.board-btn:hover{
  background:linear-gradient(135deg,#ff6a00,#ff9f1c);
}

/* 🔴 ERS Pending Special Button */
.pending-btn{
  background:linear-gradient(135deg,#d32f2f,#f44336);
  font-weight:bold;
}
.pending-btn:hover{
  background:linear-gradient(135deg,#b71c1c,#e53935);
}

/* CUSTOM DROPDOWN */
.dropdown{
  position:relative;
  display:flex;
  flex-direction:column;
}
.dropdown input{
  width:100%;
  padding:12px;
  font-size:14px;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
  flex:1;
}
.dropdown-list{
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  max-height:220px;
  overflow-y:auto;
  background:white;
  border:1px solid #ccc;
  border-top:none;
  display:none;
  z-index:999;
}
.dropdown-list div{
  padding:10px;
  cursor:pointer;
  font-size:13px;
}
.dropdown-list div:hover{
  background:#e6f0ff;
}

.footer{
  text-align:center;
  padding:15px;
  font-size:14px;
  color:#555
}

/* DESKTOP VIEW */
@media(max-width:1000px){
  .container{
    grid-template-columns:1fr;
  }
}

/*==================================================
  MOBILE APP STYLE (max-width: 768px)
==================================================*/
@media screen and (max-width:768px){

body{
    font-size:12px;
    overflow-x:hidden;
}

/* Header */
.header{
    padding:12px 8px;
}

.header h1{
    font-size:22px;
}

.header p{
    font-size:11px;
    margin-top:2px;
}

.header .credit{
    font-size:9px;
}

.scan-icon{
    left:8px;
    top:12px;
    font-size:18px;
    padding:7px 9px;
    border-radius:8px;
}

/* Container & Layout */
.container{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:8px;
    padding:0;
}

.card{
    padding:12px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.card h2{
    font-size:16px;
    margin:0 0 10px;
}

/* Drive inputs - Mobile 3 equal columns with matching heights */
.drive-inputs{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:6px;
    margin-bottom:10px;
    align-items: stretch;
}

.dropdown{
    display:flex;
    flex-direction:column;
}

.dropdown input{
    padding:10px 8px;
    font-size:12px;
    min-height:44px;
    box-sizing:border-box;
    flex:1;
}

.drive-inputs button{
    min-height:44px;
    padding:6px 8px;
    font-size:12px;
    font-weight:600;
    height:100%;
}

.dropdown-list div{
    padding:8px;
    font-size:12px;
}

/* Action buttons - 3 columns */
.drive-action-buttons{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:6px;
    margin-bottom:10px;
}

.drive-action-buttons button{
    min-height:40px;
    padding:6px 8px;
    font-size:10px;
}

/* Grid buttons - Mobile 3 columns */
.master-btns, .jobs-btns{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:6px;
}

.master-btns button, .jobs-btns button{
    width:100%;
    min-height:40px;
    padding:8px 6px;
    font-size:10px;
    font-weight:600;
    border-radius:8px;
    white-space:normal;
    word-break:break-word;
    overflow:hidden;
}

/* Footer */
.footer{
    font-size:10px;
    padding:10px;
}

/* Floating Scan */
.floating-scan{
    width:52px;
    height:52px;
    right:12px;
    bottom:12px;
    font-size:22px;
}

}

/*==================================================
  EXTRA SMALL DEVICES (max-width: 480px)
==================================================*/
@media screen and (max-width:480px){

.header h1{
    font-size:18px;
}

.card h2{
    font-size:14px;
}

/* Grid buttons - Extra small: 3 columns */
.master-btns, .jobs-btns{
    grid-template-columns: repeat(3, 1fr);
    gap:6px;
}

.master-btns button, .jobs-btns button{
    min-height:38px;
    padding:6px 4px;
    font-size:9px;
}

.drive-inputs{
    grid-template-columns: repeat(3, 1fr);
    gap:6px;
    align-items: stretch;
}

.drive-action-buttons{
    grid-template-columns: repeat(3, 1fr);
    gap:6px;
}

.drive-action-buttons button{
    min-height:38px;
    padding:4px 6px;
    font-size:9px;
}

.dropdown input{
    min-height:42px;
    padding:8px 6px;
}

.drive-inputs button{
    min-height:42px;
    padding:4px 6px;
    font-size:11px;
}

}
</style>
</head>

<body>

<div class="header">
  <!-- 🔵 Animated Header Scan -->
  <div class="scan-icon" onclick="openScanner()">📷</div>

  <div class="header-row">
    <div class="header-center">
      <h1>08 Electrical Data</h1>
      <p>Drive Information & Maintenance History</p>
      <div class="credit">Designed and Maintained by RAKESH CHANDRA SETHY</div>
    </div>
  </div>
</div>

<div class="container">

<!-- SELECT DRIVE - FIRST -->
<div class="card">
  <h2>Select Drive</h2>
  
  <div class="drive-inputs">
    <div class="dropdown">
      <input id="mainDrive" placeholder="Select / Type Main Drive">
      <div class="dropdown-list" id="mainList"></div>
    </div>
    <div class="dropdown">
      <input id="subDrive" placeholder="Select / Type Sub Drive">
      <div class="dropdown-list" id="subList"></div>
    </div>
    <button onclick="openView()">VIEW</button>
  </div>

  <div class="drive-action-buttons">
    <button onclick="openHistory()">HISTORY</button>
    <button onclick="openJobEntry()">📝 NEW JOB ENTRY</button>
    <button onclick="openAdvanced()">📊 Advanced Summary</button>
  </div>
</div>

<!-- MASTER -->
<div class="card">
  <h2>Master List</h2>
  <div class="master-btns">
    <button onclick="openMonthlyJobPlan()">🗓️ Monthly Job Plan</button>
    <button onclick="openMotorList()">⚙️ Motor List</button>
    <button onclick="openTrafoList()">⚡ Transformer List</button>
    <button onclick="openBreakerList()">🔌 Breaker List</button>
    <button class="board-btn" onclick="openBoardList()">🗄️ Board List</button>
    <button onclick="openERSMaster()">🗂️ ERS Master</button>
    <button class="pending-btn" onclick="openERSPending()">📌 ERS Pending</button>
  </div>
</div>

<!-- JOBS -->
<div class="card">
  <h2>Jobs</h2>
  <div class="jobs-btns">
    <button onclick="openMonthlyTrend()">📈 Monthly Job Trend</button>
    <button onclick="openMotorOH()">🛠️ Motor O/H Data</button>
    <button onclick="openMotorPM()">🧾 Motor PM Status</button>
    <button onclick="openTrafoPM()">⚡ Transformer Status</button>
    <button onclick="openTrafoOil()">🛢️ Transformer Oil Report</button>
    <button onclick="openBreakerPM()">🔌 Breaker PM Status</button>
    <button onclick="openBoardPM()">🗄️ Board PM Status</button>
  </div>
</div>

</div>

<div class="footer">
© 08 Electrical Data | Designed & Maintained by Rakesh Chandra Sethy
</div>

<!-- 🟢 Floating Scanner Button -->
<div class="floating-scan" onclick="openScanner()">📷</div>

<script>

/* 🔓 Open Scanner */
function openScanner(){
  location.href="https://08electricaldata.github.io/scanview.html";
}

/* Open functions WITHOUT PASSWORD */
function openMonthlyJobPlan(){
  location.href="https://08electricaldata.github.io/drive-viewer/mobile/monthlyjobplan.html";
}

function openMotorList(){
  location.href="https://08electricaldata.github.io/drive-viewer/mobile/motorlist.html";
}

function openTrafoList(){
  location.href="https://08electricaldata.github.io/drive-viewer/mobile/trafolist.html";
}

function openBreakerList(){
  location.href="https://08electricaldata.github.io/drive-viewer/breakerlist.html";
}

function openBoardList(){
  location.href="https://08electricaldata.github.io/drive-viewer/boardlist.html";
}

function openERSMaster(){
  location.href="https://08electricaldata.github.io/drive-viewer/ersmasterdata.html";
}

function openERSPending(){
  location.href="https://08electricaldata.github.io/drive-viewer/ersmasterdata1.html";
}

function openJobEntry(){
  location.href="https://08electricaldata.github.io/jobsubmit.html";
}

function openAdvanced(){
  location.href="https://08electricaldata.github.io/drive-viewer/summary-advanced.html";
}

function openMonthlyTrend(){
  location.href="https://08electricaldata.github.io/drive-viewer/monthly-jobs.html";
}

function openMotorOH(){
  location.href="https://08electricaldata.github.io/drive-viewer/mobile/motoroh.html";
}

function openMotorPM(){
  location.href="https://08electricaldata.github.io/drive-viewer/motorpm.html";
}

function openTrafoPM(){
  location.href="https://08electricaldata.github.io/drive-viewer/trafopm.html";
}

function openTrafoOil(){
  location.href="https://08electricaldata.github.io/drive-viewer/transformer-oil-summary.html";
}

function openBreakerPM(){
  location.href="https://08electricaldata.github.io/drive-viewer/breakerpm.html";
}

function openBoardPM(){
  location.href="https://08electricaldata.github.io/drive-viewer/boardpm.html";
}

/* View and History WITHOUT PASSWORD */
function openView(){
  const main=mainDrive.value;
  const sub=subDrive.value;
  if(!main || !sub){
    alert("Please select both Main Drive and Sub Drive");
    return;
  }
  const id=main+"-"+sub;
  location.href="https://08electricaldata.github.io/drive-viewer/mobile/index.html?id="+encodeURIComponent(id);
}

function openHistory(){
  const main=mainDrive.value;
  const sub=subDrive.value;
  if(!main || !sub){
    alert("Please select both Main Drive and Sub Drive");
    return;
  }
  const id=main+"-"+sub;
  location.href="https://08electricaldata.github.io/drive-viewer/mobile/history.html?id="+encodeURIComponent(id);
}

/* ======= DROPDOWN SCRIPT ======= */

const DRIVE_JSON =
"https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dropdown/drives.json";

let headers=[],rows=[],mainMap={};

async function loadSheet(){
  const d=await (await fetch(DRIVE_JSON)).json();
  headers=d.headers;
  rows=d.rows;
  buildMain();
}

function buildMain(){
  const list=document.getElementById("mainList");
  list.innerHTML="";
  headers.forEach((h,i)=>{
    if(i<7||!h)return;
    mainMap[h]=i;
    const div=document.createElement("div");
    div.innerText=h;
    div.onclick=()=>{
      mainDrive.value=h;
      list.style.display="none";
      buildSub(i);
    };
    list.appendChild(div);
  });
}

function buildSub(index){
  const list=document.getElementById("subList");
  list.innerHTML="";
  rows.forEach(r=>{
    if(r[index]){
      const div=document.createElement("div");
      div.innerText=r[index];
      div.onclick=()=>{
        subDrive.value=r[index];
        list.style.display="none";
      };
      list.appendChild(div);
    }
  });
}

mainDrive.onfocus=()=>mainList.style.display="block";
subDrive.onfocus=()=>subList.style.display="block";

mainDrive.oninput=function(){
  const filter=this.value.toLowerCase();
  [...mainList.children].forEach(d=>{
    d.style.display=d.innerText.toLowerCase().includes(filter)?"block":"none";
  });
};

subDrive.oninput=function(){
  const filter=this.value.toLowerCase();
  [...subList.children].forEach(d=>{
    d.style.display=d.innerText.toLowerCase().includes(filter)?"block":"none";
  });
};

document.addEventListener("click",e=>{
  if(!e.target.closest(".dropdown")){
    mainList.style.display="none";
    subList.style.display="none";
  }
});

loadSheet();
</script>

</body>
</html>
