<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Job Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  background:#0e1621;
  color:#e5e7eb;
  margin:0;
  padding:16px;
}

.top-nav{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.top-nav button{
  padding:6px 14px;
  font-size:14px;
  background:#003f88;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.top-title{
  flex:1;
  text-align:center;
}

.top-title strong{
  display:block;
  font-size:16px;
  color:#93c5fd;
}

.top-title span{
  font-size:12px;
  opacity:0.9;
}

.container{
  background:#1b2636;
  padding:20px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  max-width:520px;
  margin:auto;
}

.field{
  margin-bottom:22px;
  position:relative;
}

textarea{
  width:100%;
  padding:10px;
  font-size:14px;
  background:#111827;
  color:#e5e7eb;
  border:1px solid #334155;
  border-radius:6px;
  height:110px;
  resize:none;
}

button.submit-btn{
  width:100%;
  padding:12px;
  background:#003f88;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button.submit-btn:hover{
  background:#0050aa;
}

#msg{
  text-align:center;
  font-weight:bold;
  color:#22c55e;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="top-nav">
  <button onclick="history.back()">⬅ Back</button>
  <div class="top-title">
    <strong>Job Entry</strong>
    <span>Designed and Maintained by Rakesh Chandra Sethy</span>
  </div>
  <button onclick="location.href='https://08electricaldata.github.io/'">🏠 Home</button>
</div>

<div class="container">

<form id="jobForm" target="hiddenFrame"
action="https://docs.google.com/forms/d/e/1FAIpQLSeq4rgnqQHCZqJiwnbrdtds8Pk47ZdNlzDJL8SOeNw5z-fFTw/formResponse"
method="POST">

<input type="hidden" name="entry.2074265710" id="dateField">
<input type="hidden" name="entry.2034418039" id="mainDrive">
<input type="hidden" name="entry.273858386" id="subDrive">

<div class="field">
  <label>Job Details</label>
  <textarea name="entry.556400630" required></textarea>
</div>

<button type="submit" class="submit-btn">SUBMIT</button>
<div id="msg"></div>

</form>

<iframe name="hiddenFrame" style="display:none"></iframe>
</div>

<script>
const today = new Date();
document.getElementById("dateField").value = today.toISOString().split("T")[0];

const id = new URLSearchParams(location.search).get("id");
if(id){
  const firstDash = id.indexOf("-");
  if(firstDash !== -1){
    document.getElementById("mainDrive").value = id.substring(0, firstDash);
    document.getElementById("subDrive").value = id.substring(firstDash + 1);
  }
}

const jobForm = document.getElementById("jobForm");
const msg = document.getElementById("msg");

jobForm.addEventListener("submit", () => {
  setTimeout(() => {
    msg.innerText = "✅ Submitted successfully. Pending verification.";

    /* 🔊 Beep Sound */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
    oscillator.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.2);

    /* 📳 Vibration */
    if(navigator.vibrate) navigator.vibrate(200);

    /* Redirect */
    setTimeout(() => {
      window.location.href = "https://08electricaldata.github.io/scanjob.html";
    }, 1500);

  }, 800);
});
</script>

</body>
</html>
