<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Job Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  background:#0e1621;
  color:#e5e7eb;
  margin:0;
  padding:16px;
}

/* ===== TOP NAV ===== */
.top-nav{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.top-nav button{
  padding:6px 14px;
  font-size:14px;
  background:#003f88;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.top-title{
  flex:1;
  text-align:center;
}

.top-title strong{
  display:block;
  font-size:16px;
  color:#93c5fd;
}

.top-title span{
  font-size:12px;
  opacity:0.9;
}

/* ===== CARD ===== */
.container{
  background:#1b2636;
  padding:20px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  max-width:520px;
  margin:auto;
}

/* ===== FIELD ===== */
.field{
  margin-bottom:22px;
  position:relative;
}

/* ===== MATERIAL INPUT ===== */
.material-input{
  position:relative;
}

.material-input input{
  width:100%;
  padding:14px 10px 8px;
  font-size:15px;
  background:#111827;
  border:1px solid #334155;
  border-radius:6px;
  color:#e5e7eb;
}

.material-input label{
  position:absolute;
  left:12px;
  top:14px;
  font-size:14px;
  color:#9ca3af;
  pointer-events:none;
  transition:all .2s ease;
}

.material-input input:focus + label,
.material-input input:not(:placeholder-shown) + label{
  top:4px;
  font-size:11px;
  color:#60a5fa;
}

/* ===== DROPDOWN ===== */
.dropdown{
  position:absolute;
  width:100%;
  background:#1f2937;
  border:1px solid #334155;
  border-radius:6px;
  margin-top:4px;
  max-height:220px;
  overflow-y:auto;
  z-index:1000;
}

.dropdown-item{
  padding:10px;
  cursor:pointer;
  transition:background .15s;
}

.dropdown-item:hover{
  background:#003f88;
}

/* ===== OTHER INPUTS ===== */
textarea,select{
  width:100%;
  padding:10px;
  font-size:14px;
  background:#111827;
  color:#e5e7eb;
  border:1px solid #334155;
  border-radius:6px;
}

textarea{
  height:110px;
  resize:none;
}

button.submit-btn{
  width:100%;
  padding:12px;
  background:#003f88;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button.submit-btn:hover{
  background:#0050aa;
}

#msg{
  text-align:center;
  font-weight:bold;
  color:#22c55e;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="top-nav">
  <button onclick="history.back()">⬅ Back</button>
  <div class="top-title">
    <strong>Job Entry</strong>
    <span>Designed and Maintained by Rakesh Chandra Sethy</span>
  </div>
  <button onclick="location.href='https://08electricaldata.github.io/'">🏠 Home</button>
</div>

<div class="container">

<form id="jobForm" target="hiddenFrame"
action="https://docs.google.com/forms/d/e/1FAIpQLSeq4rgnqQHCZqJiwnbrdtds8Pk47ZdNlzDJL8SOeNw5z-fFTw/formResponse"
method="POST">

<input type="hidden" name="entry.2074265710" id="dateField">
<input type="hidden" name="entry.2034418039" id="mainDrive">
<input type="hidden" name="entry.273858386" id="subDrive">
<input type="hidden" name="entry.1114156376" id="natureHidden">

<!-- MATERIAL SEARCHABLE DROPDOWN -->
<div class="field">
  <div class="material-input">
    <input type="text" id="natureInput" placeholder=" " autocomplete="off" required>
    <label>Nature of Job</label>
  </div>
  <div class="dropdown" id="dropdown"></div>
</div>

<div class="field">
  <label>Job Details</label>
  <textarea name="entry.556400630" required></textarea>
</div>

<div class="field">
  <label>Job By</label>
  <select name="entry.972123475" required>
    <option value="">Select</option>
    <option>NALCO</option>
    <option>ANIL_AREA</option>
    <option>Nalco & ANIL</option>
    <option>Nalco & SUPPLY</option>
    <option>SUPPLY & ANIL</option>
    <option>SUPPLY</option>
    <option>MOTOR</option>
    <option>NALCO_ANIL_SUPPLY</option>
    <option>SUNIL BISWAL</option>
    <option>MAHARANA BDM</option>
  </select>
</div>

<button type="submit" class="submit-btn">SUBMIT</button>
<div id="msg"></div>

</form>

<iframe name="hiddenFrame" style="display:none"></iframe>
</div>

<script>
/* AUTO DATE */
const today=new Date();
dateField.value=today.toISOString().split("T")[0];

/* READ ID */
const id=new URLSearchParams(location.search).get("id");
if(id){
  const firstDash=id.indexOf("-");
  if(firstDash!==-1){
    mainDrive.value=id.substring(0,firstDash);
    subDrive.value=id.substring(firstDash+1);
  }
}

/* LOAD DATA */
let natureData=[];
fetch("https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dropdown/drives.json")
.then(r=>r.json())
.then(j=>{
  const set=new Set();
  j.rows.forEach(r=>{
    const v=(r[2]||"").trim();
    if(v) set.add(v);
  });

  natureData=[...set].sort((a,b)=>a.localeCompare(b));
  renderDropdown(natureData);
});

/* DROPDOWN LOGIC */
const input=document.getElementById("natureInput");
const dropdown=document.getElementById("dropdown");
const hidden=document.getElementById("natureHidden");

function renderDropdown(list){
  dropdown.innerHTML="";
  list.forEach(v=>{
    const div=document.createElement("div");
    div.className="dropdown-item";
    div.textContent=v;
    div.onclick=()=>{
      input.value=v;
      hidden.value=v;
    };
    dropdown.appendChild(div);
  });
}

/* Filter while typing */
input.addEventListener("input",()=>{
  const q=input.value.toLowerCase();
  const filtered=natureData.filter(v=>v.toLowerCase().includes(q));
  renderDropdown(filtered);
});

/* Prevent invalid */
jobForm.addEventListener("submit",e=>{
  if(!natureData.includes(input.value)){
    alert("Please select valid Nature of Job from list.");
    e.preventDefault();
  }
});

/* Success */
jobForm.onsubmit=()=>{
  setTimeout(()=>{
    msg.innerText="✅ Submitted successfully. Pending verification.";
    jobForm.reset();
    dateField.value=today.toISOString().split("T")[0];
  },800);
};
</script>

</body>
</html>
