<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Job Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0e1621;
  color: #e5e7eb;
  margin: 0;
  padding: 16px;
}

/* ===== TOP NAV ===== */
.top-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.top-nav button {
  padding: 6px 14px;
  font-size: 14px;
  background: #003f88;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.top-title {
  flex: 1;
  text-align: center;
}

.top-title strong {
  display: block;
  font-size: 16px;
  color: #93c5fd;
}

.top-title span {
  font-size: 12px;
  opacity: 0.9;
}

/* ===== CARD ===== */
.container {
  background: #1b2636;
  padding: 18px;
  border-radius: 10px;
  box-shadow: 0 4px 14px rgba(0,0,0,.6);
  max-width: 520px;
  margin: auto;
}

/* ===== FORM ===== */
.field {
  margin-bottom: 14px;
}

label {
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 4px;
  display: block;
}

input, select, textarea {
  width: 100%;
  padding: 8px;
  font-size: 14px;
  background: #111827;
  color: #e5e7eb;
  border: 1px solid #334155;
  border-radius: 6px;
  box-sizing: border-box;
}

textarea {
  height: 110px;
  resize: none;
}

/* Scrollable dropdown */
select {
  max-height: 160px;
  overflow-y: auto;
}

/* ===== BUTTON ===== */
button.submit-btn {
  width: 100%;
  padding: 12px;
  background: #003f88;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button.submit-btn:hover {
  background: #0050aa;
}

#msg {
  text-align: center;
  font-weight: bold;
  color: #22c55e;
  margin-top: 12px;
}
</style>
</head>

<body>

<div class="top-nav">
  <button type="button" onclick="history.back()">⬅ Back</button>
  <div class="top-title">
    <strong>Job Entry</strong>
    <span>Designed and Maintained by Rakesh Chandra Sethy</span>
  </div>
  <button type="button" onclick="location.href='https://08electricaldata.github.io/'">🏠 Home</button>
</div>

<div class="container">

<form id="jobForm" target="hiddenFrame"
action="https://docs.google.com/forms/d/e/1FAIpQLSeq4rgnqQHCZqJiwnbrdtds8Pk47ZdNlzDJL8SOeNw5z-fFTw/formResponse"
method="POST">

<input type="hidden" name="entry.2074265710" id="dateField">
<input type="hidden" name="entry.2034418039" id="mainDrive">
<input type="hidden" name="entry.273858386" id="subDrive">

<!-- ===== SEARCH + DROPDOWN ===== -->
<div class="field">
  <label>Nature of Job</label>
  <input type="text" id="natureSearch" placeholder="Search...">
  <select name="entry.1114156376" id="natureSelect" size="5" required></select>
</div>

<div class="field">
  <label>Job Details</label>
  <textarea name="entry.556400630" required></textarea>
</div>

<div class="field">
  <label>Job By</label>
  <select name="entry.972123475" required>
    <option value="">Select</option>
    <option>NALCO</option>
    <option>ANIL_AREA</option>
    <option>Nalco & ANIL</option>
    <option>Nalco & SUPPLY</option>
    <option>SUPPLY & ANIL</option>
    <option>SUPPLY</option>
    <option>MOTOR</option>
    <option>NALCO_ANIL_SUPPLY</option>
    <option>SUNIL BISWAL</option>
    <option>MAHARANA BDM</option>
  </select>
</div>

<button type="submit" class="submit-btn">SUBMIT</button>
<div id="msg"></div>

</form>

<iframe name="hiddenFrame" style="display:none"></iframe>
</div>

<script>
/* AUTO DATE */
const today = new Date();
dateField.value = today.toISOString().split("T")[0];

/* READ ID */
const id = new URLSearchParams(location.search).get("id");
if (id) {
  const firstDash = id.indexOf("-");
  if (firstDash !== -1) {
    mainDrive.value = id.substring(0, firstDash);
    subDrive.value = id.substring(firstDash + 1);
  }
}

/* LOAD + SORT DATA */
let natureData = [];

fetch("https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dropdown/drives.json")
.then(r => r.json())
.then(j => {

  const set = new Set();
  j.rows.forEach(r => {
    const v = (r[2] || "").trim();
    if (v) set.add(v);
  });

  natureData = [...set].sort((a,b)=>a.localeCompare(b));
  populateDropdown(natureData);
});

function populateDropdown(data){
  natureSelect.innerHTML = "";
  data.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    natureSelect.appendChild(opt);
  });
}

/* SEARCH FILTER */
natureSearch.addEventListener("input", function(){
  const q = this.value.toLowerCase();
  const filtered = natureData.filter(v =>
    v.toLowerCase().includes(q)
  );
  populateDropdown(filtered);
});

/* SUCCESS MESSAGE */
jobForm.onsubmit = () => {
  setTimeout(() => {
    msg.innerText = "✅ Submitted successfully. Pending verification.";
    jobForm.reset();
    dateField.value = today.toISOString().split("T")[0];
  }, 800);
};
</script>

</body>
</html>
