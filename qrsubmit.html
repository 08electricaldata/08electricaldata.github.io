<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Job Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  background:#0e1621;
  color:#e5e7eb;
  margin:0;
  padding:16px;
}

.top-nav{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.top-nav button{
  padding:6px 14px;
  font-size:14px;
  background:#003f88;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.top-title{
  flex:1;
  text-align:center;
}

.top-title strong{
  display:block;
  font-size:16px;
  color:#93c5fd;
}

.top-title span{
  font-size:12px;
  opacity:0.9;
}

.container{
  background:#1b2636;
  padding:20px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  max-width:520px;
  margin:auto;
}

.field{
  margin-bottom:22px;
  position:relative;
}

.material-input{
  position:relative;
}

.material-input input{
  width:100%;
  padding:14px 10px 8px;
  font-size:15px;
  background:#111827;
  border:1px solid #334155;
  border-radius:6px;
  color:#e5e7eb;
}

.material-input label{
  position:absolute;
  left:12px;
  top:14px;
  font-size:14px;
  color:#9ca3af;
  pointer-events:none;
  transition:all .2s ease;
}

.material-input input:focus + label,
.material-input input:not(:placeholder-shown) + label{
  top:4px;
  font-size:11px;
  color:#60a5fa;
}

.dropdown{
  position:absolute;
  width:100%;
  background:#1f2937;
  border:1px solid #334155;
  border-radius:6px;
  margin-top:4px;
  max-height:0;
  overflow-y:auto;
  opacity:0;
  transition:all .2s ease;
  z-index:1000;
}

.dropdown.show{
  max-height:220px;
  opacity:1;
}

.dropdown-item{
  padding:10px;
  cursor:pointer;
}

.dropdown-item:hover,
.dropdown-item.active{
  background:#003f88;
}

textarea,select{
  width:100%;
  padding:10px;
  font-size:14px;
  background:#111827;
  color:#e5e7eb;
  border:1px solid #334155;
  border-radius:6px;
}

textarea{
  height:110px;
  resize:none;
}

button.submit-btn{
  width:100%;
  padding:12px;
  background:#003f88;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button.submit-btn:hover{
  background:#0050aa;
}

#msg{
  text-align:center;
  font-weight:bold;
  color:#22c55e;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="top-nav">
  <button onclick="history.back()">⬅ Back</button>
  <div class="top-title">
    <strong>Job Entry</strong>
    <span>Designed and Maintained by Rakesh Chandra Sethy</span>
  </div>
  <button onclick="location.href='https://08electricaldata.github.io/'">🏠 Home</button>
</div>

<div class="container">

<form id="jobForm" target="hiddenFrame"
action="https://docs.google.com/forms/d/e/1FAIpQLSeq4rgnqQHCZqJiwnbrdtds8Pk47ZdNlzDJL8SOeNw5z-fFTw/formResponse"
method="POST">

<input type="hidden" name="entry.2074265710" id="dateField">
<input type="hidden" name="entry.2034418039" id="mainDrive">
<input type="hidden" name="entry.273858386" id="subDrive">
<input type="hidden" name="entry.1114156376" id="natureHidden">

<div class="field">
  <div class="material-input">
    <input type="text" id="natureInput" placeholder=" " autocomplete="off" required>
    <label>Nature of Job</label>
  </div>
  <div class="dropdown" id="dropdown"></div>
</div>

<div class="field">
  <label>Job Details</label>
  <textarea name="entry.556400630" required></textarea>
</div>

<div class="field">
  <label>Job By</label>
  <select name="entry.972123475" required>
    <option value="">Select</option>
    <option>NALCO</option>
    <option>ANIL_AREA</option>
    <option>Nalco & ANIL</option>
    <option>Nalco & SUPPLY</option>
    <option>SUPPLY & ANIL</option>
    <option>SUPPLY</option>
    <option>MOTOR</option>
    <option>NALCO_ANIL_SUPPLY</option>
    <option>SUNIL BISWAL</option>
    <option>MAHARANA BDM</option>
  </select>
</div>

<button type="submit" class="submit-btn">SUBMIT</button>
<div id="msg"></div>

</form>

<iframe name="hiddenFrame" style="display:none"></iframe>
</div>

<script>
const today=new Date();
dateField.value=today.toISOString().split("T")[0];

const id=new URLSearchParams(location.search).get("id");
if(id){
  const firstDash=id.indexOf("-");
  if(firstDash!==-1){
    mainDrive.value=id.substring(0,firstDash);
    subDrive.value=id.substring(firstDash+1);
  }
}

let natureData=[];
fetch("https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/dropdown/drives.json")
.then(r=>r.json())
.then(j=>{
  const set=new Set();
  j.rows.forEach(r=>{
    const v=(r[2]||"").trim();
    if(v) set.add(v);
  });
  natureData=[...set].sort((a,b)=>a.localeCompare(b));
});

const input=document.getElementById("natureInput");
const dropdown=document.getElementById("dropdown");
const hidden=document.getElementById("natureHidden");
let currentIndex=-1;

function render(list){
  dropdown.innerHTML="";
  list.forEach((v,i)=>{
    const div=document.createElement("div");
    div.className="dropdown-item";
    div.textContent=v;
    div.onclick=()=>selectValue(v);
    dropdown.appendChild(div);
  });
  if(list.length>0) dropdown.classList.add("show");
  else dropdown.classList.remove("show");
}

function selectValue(val){
  input.value=val;
  hidden.value=val;
  dropdown.classList.remove("show");
}

input.addEventListener("focus",()=>render(natureData));

input.addEventListener("input",()=>{
  const q=input.value.toLowerCase();
  const filtered=natureData.filter(v=>v.toLowerCase().includes(q));
  currentIndex=-1;
  render(filtered);
});

input.addEventListener("keydown",(e)=>{
  const items=document.querySelectorAll(".dropdown-item");
  if(e.key==="ArrowDown") currentIndex++;
  if(e.key==="ArrowUp") currentIndex--;
  if(e.key==="Enter"){
    e.preventDefault();
    if(items[currentIndex]) selectValue(items[currentIndex].textContent);
  }
  items.forEach(i=>i.classList.remove("active"));
  if(items.length>0){
    if(currentIndex>=items.length) currentIndex=0;
    if(currentIndex<0) currentIndex=items.length-1;
    if(items[currentIndex]) items[currentIndex].classList.add("active");
  }
});

document.addEventListener("click",(e)=>{
  if(!e.target.closest(".field")) dropdown.classList.remove("show");
});

jobForm.addEventListener("submit",e=>{
  if(!natureData.includes(input.value)){
    alert("Please select valid Nature of Job.");
    e.preventDefault();
    return;
  }

  setTimeout(()=>{
    msg.innerText="✅ Submitted successfully. Pending verification.";

    /* 🔊 Beep Sound */
    const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const oscillator=audioCtx.createOscillator();
    oscillator.type="sine";
    oscillator.frequency.setValueAtTime(800,audioCtx.currentTime);
    oscillator.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime+0.2);

    /* 📳 Vibration */
    if(navigator.vibrate) navigator.vibrate(200);

    /* Redirect */
    setTimeout(()=>{
      window.location.href="https://08electricaldata.github.io/scan.html";
    },1500);

  },800);
});
</script>

</body>
</html>
